name: colors-linter

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on all files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and libraries
        run: npm ci

      - name: Run linting
        run: npm run lint
